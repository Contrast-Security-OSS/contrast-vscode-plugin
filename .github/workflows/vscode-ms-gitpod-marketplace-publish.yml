name: Publish VS Code Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: true

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build extension
      - name: Build extension
        run: npm run build

      # 5️⃣ Run tests
      - name: Run tests
        run: npx jest || echo "No tests found"
        
      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Start Xvfb
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &

      - name: Run Basic Health Check
        env:
          DISPLAY: :99
        run: npm run uitest

      # 6️⃣ Version bump x.y.z
      - name: Bump version
        id: bump
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(currentVersion) {
            let [x, y, z] = currentVersion.split('.').map(Number);
            z++;
            if (z > 9) { z = 0; y++; }
            if (y > 9) { y = 0; x++; }
            return `${x}.${y}.${z}`;
          }

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const newVersion = bumpVersion(pkg.version);
          pkg.version = newVersion;

          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          fs.writeFileSync(process.env.GITHUB_OUTPUT, `version=${newVersion}\n`, { flag: "a" });
          EOF

      # 7️⃣ Ensure vsce installed
      - name: Ensure vsce is installed
        run: |
          if ! command -v vsce &> /dev/null; then
            npm install -g @vscode/vsce
          fi

      # 8️⃣ Package extension
      - name: Package extension
        run: vsce package

      # 🔐 Validate Microsoft Marketplace Token
      - name: Validate Microsoft Marketplace Token
        run: |
          echo "🔐 Validating Microsoft Marketplace token..."
          EXTENSION_ID=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          set +e
          VSCE_PAT=${{ secrets.VS_MARKETPLACE_TOKEN }} npx vsce show $EXTENSION_ID 2>&1
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "❌ INVALID Microsoft Marketplace Token"
            exit $exit_code
          fi
          echo "✅ Microsoft Marketplace token is valid"

      # 🔐 Validate GitPod/OpenVSX Token
      - name: Validate GitPod/OpenVSX Token
        run: |
          echo "🔐 Validating GitPod/OpenVSX token..."
          NAMESPACE=$(node -p "require('./package.json').publisher")
          set +e
          output=$(npx ovsx verify-pat $NAMESPACE -p ${{ secrets.GITPOD_MARKETPLACE_TOKEN }} 2>&1)
          exit_code=$?
          echo "$output"

          if [ $exit_code -ne 0 ]; then
            echo "❌ INVALID GitPod/OpenVSX Token"
            exit $exit_code
          fi

          echo "✅ GitPod/OpenVSX token is valid for namespace $NAMESPACE"

      # 9️⃣ Check version in BOTH marketplaces
      - name: Check versions in both Marketplaces
        id: check_version
        run: |
          EXTENSION_ID=$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "🔍 Checking extension: $EXTENSION_ID"
          echo "🔍 New version to publish: $VERSION"
          echo ""

          ms_exists=false
          gitpod_exists=false

          echo "📌 Microsoft Marketplace:"
          MS_VERSION=$(npx vsce show $EXTENSION_ID -p "${{ secrets.VS_MARKETPLACE_TOKEN }}" 2>/dev/null | grep "Version:" | awk '{print $2}')

          if [ -z "$MS_VERSION" ]; then
            echo " ❌ Not published on Microsoft Marketplace"
          else
            echo " ✅ Current version on MS Marketplace = $MS_VERSION"
            if [ "$MS_VERSION" = "$VERSION" ]; then ms_exists=true; fi
          fi

          echo ""
          echo "📌 GitPod / OpenVSX Marketplace:"
          GITPOD_VERSION=$(npx ovsx show $EXTENSION_ID -p "${{ secrets.GITPOD_MARKETPLACE_TOKEN }}" 2>/dev/null | grep "Version:" | awk '{print $2}')

          if [ -z "$GITPOD_VERSION" ]; then
            echo " ❌ Not published on GitPod/OpenVSX"
          else
            echo " ✅ Current version on GitPod/OpenVSX = $GITPOD_VERSION"
            if [ "$GITPOD_VERSION" = "$VERSION" ]; then gitpod_exists=true; fi
          fi

          echo ""
          echo "-----------------------------------------"
          echo "🧪 Comparing with new version: $VERSION"
          echo "-----------------------------------------"

          if [ "$ms_exists" = true ] || [ "$gitpod_exists" = true ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⛔ Version $VERSION already exists — blocking publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✔ Version $VERSION does NOT exist — safe to publish."
          fi
          
     # 🔟 Publish to Microsoft Marketplace (both must publish or none)
      - name: Publish to Visual Studio Marketplace
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "Publishing to MS Marketplace..."
          set +e
          output=$(npx vsce publish -p ${{ secrets.VS_MARKETPLACE_TOKEN }} 2>&1)
          exit_code=$?
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            exit 1
          fi

          if [ $exit_code -ne 0 ]; then
            exit $exit_code
          fi
          
      # 1️⃣1️⃣ Publish to GitPod Marketplace (must match MS result)
      - name: Publish to GitPod Marketplace
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "⏳ Publishing to GitPod Marketplace..."
          set +e
          output=$(npx ovsx publish -p ${{ secrets.GITPOD_MARKETPLACE_TOKEN }} 2>&1)
          exit_code=$?
          echo "$output"

          if echo "$output" | grep -q "already exists"; then
            exit 1
          fi

          if [ $exit_code -ne 0 ]; then
            echo "❌ GitPod publish failed — aborting to prevent version mismatch."
            exit $exit_code
          fi


      # 1️⃣2️⃣ Commit version bump
      - name: Commit and push version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}" || echo "No changes"
          git push origin HEAD:${GITHUB_REF_NAME}
          

      # 1️⃣3️⃣ Upload artifact
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-${{ steps.bump.outputs.version }}
          path: "*.vsix"
